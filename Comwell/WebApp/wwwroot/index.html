<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="description" content="Comwell - Læringsplatform for køkkenelever og personale" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Comwell" />
    <meta name="format-detection" content="telephone=no" />
    
    <title>Comwell</title>
    <base href="/" />
    
    <!-- Preload critical resources -->
    <link rel="preload" href="css/app.css" as="style" />
    <link rel="preload" href="WebApp.styles.css" as="style" />
    
    <!-- Critical CSS first -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="WebApp.styles.css" />
    
    <!-- Non-critical CSS with media queries for performance -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" media="screen" />
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.css" media="screen" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" media="screen" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" media="screen" />
    
    <!-- Icons and PWA manifest -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    
    <!-- Preload critical JavaScript -->
    <link rel="modulepreload" href="_framework/blazor.webassembly.js" />
    
    <!-- Performance optimizations -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <script>
        // Optimize loading
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').catch(function() {
                    // Service worker registration failed
                });
            });
        }
        
        // Prevent zoom on input focus (iOS Safari)
        document.addEventListener('touchstart', function() {}, {passive: true});
        
        // Enhance touch scrolling
        document.addEventListener('DOMContentLoaded', function() {
            document.body.style.webkitOverflowScrolling = 'touch';
            document.body.style.overflowScrolling = 'touch';
        });
    </script>
</head>

<body>
    <div id="app">
        <div class="loading-container">
            <svg class="loading-progress" aria-label="Indlæser Comwell">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text" aria-live="polite"></div>
        </div>
    </div>

    <div id="blazor-error-ui" role="alert" aria-live="assertive">
        <span>Der opstod en fejl.</span>
        <button class="dismiss" aria-label="Luk fejlmeddelelse" type="button">🗙</button>
    </div>
    
    <!-- Critical JavaScript -->
    <script src="_framework/blazor.webassembly.js"></script>
    
    <!-- Non-critical JavaScript loaded after main content -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // File download utility
        window.downloadFile = (dataUrl, filename) => {
            try {
                // Extract base64 data from data URL
                const base64Data = dataUrl.split(',')[1];
                const bytes = new Uint8Array(atob(base64Data).split('').map(c => c.charCodeAt(0)));
                const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                console.log('Excel fil downloaded:', filename);
            } catch (error) {
                console.error('Download fejl:', error);
                alert('Der opstod en fejl under download af filen. Se konsollen for detaljer.');
            }
        };
        
        // Mobile viewport fix for iOS
        function setViewportHeight() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('orientationchange', function() {
            setTimeout(setViewportHeight, 100);
        });
        setViewportHeight();
        
        // Touch-friendly focus management
        document.addEventListener('DOMContentLoaded', function() {
            // Add focus ring only for keyboard navigation
            let isUsingKeyboard = false;
            
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Tab') {
                    isUsingKeyboard = true;
                    document.body.classList.add('keyboard-focus');
                }
            });
            
            document.addEventListener('mousedown', function() {
                isUsingKeyboard = false;
                document.body.classList.remove('keyboard-focus');
            });
            
            document.addEventListener('touchstart', function() {
                isUsingKeyboard = false;
                document.body.classList.remove('keyboard-focus');
            });
        });
        
        // Prevent double-tap zoom on buttons
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
    
    <style>
        /* Critical loading styles */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            z-index: 9999;
        }
        
        /* Enhanced focus styles for accessibility */
        body:not(.keyboard-focus) *:focus {
            outline: none;
        }
        
        body.keyboard-focus *:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }
        
        /* Prevent zoom on iOS */
        @media screen and (max-width: 768px) {
            input[type="text"],
            input[type="email"],
            input[type="password"],
            input[type="number"],
            textarea,
            select {
                font-size: 16px !important;
            }
        }
        
        /* Enhanced error UI for mobile */
        #blazor-error-ui {
            font-size: 14px;
            line-height: 1.4;
        }
        
        @media (max-width: 480px) {
            #blazor-error-ui {
                padding: 12px 16px 12px 3rem;
                font-size: 13px;
            }
            
            #blazor-error-ui .dismiss {
                width: 28px;
                height: 28px;
                right: 8px;
                top: 8px;
            }
        }
    </style>
</body>

</html>
